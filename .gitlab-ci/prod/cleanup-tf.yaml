CleanupPipelineFilesPowerShell_prod:
  stage: main
  tags:
    - "mcis, windows, azure, prod"
  rules:
    - if: ($CLEANUPPIPELINEFILES == "true" && $CI_COMMIT_BRANCH == "main")
      when: on_success
    - when: never
  script:
    - |
      write-host "IMPORTANT: If this is running on a runner cluster, there is no guarantee that this cleanup job is running on the same runner instance that ran previous jobs that created the build artifacts. Many cleanup runs on a cluster will have some effect by eventually cleaning up many of the build job directories."
      if ((${CI_DISPOSABLE_ENVIRONMENT} -ieq 'true') -and (${FORCE} -ine 'true')) {
        Write-Host "This CI environment is disposed of at the end of every job, skipping cleanup of ${CI_BUILDS_DIR}"
      } else {

        echo "Removing old build files using method: ${CLEANUPMETHOD,,}"
        cd ${CI_BUILDS_DIR}
        #Note - .git folder delete is never verbose
        if ($VERBOSESWITCH -ieq 'true' ) {
          $VerbosePreference='Continue'
        }
        if ("${CLEANUPMETHOD}" -ieq "just_this_job") {       
          Remove-Item -Path ${CI_PROJECT_DIR}/.git -Recurse -Force
          Remove-Item -Path ${CI_PROJECT_DIR} -Recurse -Force -Verbose 4>&1
        } elseif ("${CLEANUPMETHOD}" -ieq "all_older_files") {
          Get-ChildItem –Path "${CI_BUILDS_DIR}" -Recurse | Where-Object {($_.LastWriteTime -lt (Get-Date).AddDays(-${OLDER_FILES_AGE_DAYS}))} | Remove-Item
        } else {
          write-host "Cleanup method '${CLEANUPMETHOD}' is unknown."
        }
      }
  needs:
    - job: apply_prod

