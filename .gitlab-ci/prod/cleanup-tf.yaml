#CLEANUPPIPELINEFILES must be "true" for action to be taken
#CI_DISPOSABLE_ENVIRONMENT is 'true' on GitHub executors that toss the entire run environment.
#CI_SHARED_ENVIRONMENT is only available on GitLab Executors that don't toss the run environment. (Currently Shell and Ssh)
# You can save unnecessary time doing deletes by enabling the below rules that contain it.
# Set VERSBOSESWITCH to '' to prevent output showing every file delete.

variables:
  CLEANUPPIPELINEFILES:
    value: "true"
    description: "This must be set to 'true' for cleanup to be attempted"
  VERBOSESWITCH:
    value: "false"
    description: "Set to 'true' to show the list of file deletes in the log for testing if things are working as desired."
  FORCE:
    value: "false"
    description: "Under normal circumstances, this code will not delete when $CI_DISPOSABLE_ENVIRONMENT is 'true' as it wastes compute because the entire environment is disposed of (e.g. when building using containers.)  This parameter always forces a delete - can be used for testing."
  DOCKERCLEANUP:
    value: "false"
    description: "Generally this is intended for shell runners that have docker installed, especially those with GitLab Runner pull_policy set to 'if-not-present' or 'never'. If desired a shell runner can be setup on all Docker runners (and locked down) just to run this maintenance from runner jobs."
  CLEANUPMETHOD:
    value: "just_this_job"
    description: 'Valid Values: "just_this_job" - attempts to cleanup files from just this job. Works well for single shell runners or pipelines locked to a single runner. "all_older_files" - cleans up all files over the number of days indicated by OLDER_FILES_AGE_DAYS. Keeps the whole cluster clean when used on all jobs.'
  OLDER_FILES_AGE_DAYS:
    value: "30"
    description: "How old, in days, should files be to delete them."
  
