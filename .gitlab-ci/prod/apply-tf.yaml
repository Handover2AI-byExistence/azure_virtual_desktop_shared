variables:
  GIT_SUBMODULE_STRATEGY: recursive

apply_prod:
  timeout: 2h 
  stage: main
  tags:
    - "mcis, windows, azure, prod"
  environment:
    name: prod
  allow_failure: false
  when: manual
  before_script:
    - terraform init -backend-config="./vars/backend-prod.tfvars" -backend-config="client_id=$AZURE_CLIENT_ID_PROD" -backend-config="client_secret=$AZURE_CLIENT_SECRET_PROD" -backend-config="tenant_id=$AZURE_TENANT_ID_PROD" -backend-config="subscription_id=$AZURE_MGT_SUBSCRIPTION_ID_PROD"
    - az login --service-principal -u $AZURE_CLIENT_ID_PROD -p $AZURE_CLIENT_SECRET_PROD --tenant $AZURE_TENANT_ID_PROD

    # Ensure Az PowerShell module is available
    #- pwsh -Command "if (-not (Get-Module -ListAvailable -Name Az)) { Install-Module Az -Force -Scope CurrentUser }"

  script:
   #- echo "Running PowerShell script to fetch next available Firewall Policy priority..."
   # Run your script (adjust the path and arguments)   
   #- pwsh -File "./script/get-next-priority-firewall.ps1" -SubscriptionId $AZURE_CON_SUBSCRIPTION_ID_PROD -ResourceGroup $AZURE_FW_RESOURCEGROUP_PROD -PolicyName $AZURE_FW_POLICY_PROD


   # Load TF_VAR_priority from script output file
   #- Get-Content priority.env | ForEach-Object {
   #     if ($_ -match 'TF_VAR_priority=(.*)') {
   #       $env:TF_VAR_priority = $matches[1]
   #     }
   #   }
   #- echo "Next available priority $env:TF_VAR_priority"

   - echo "Running terraform apply for Prod environment..."
   - terraform apply -auto-approve -var-file="./vars/terraform-prod.tfvars"
   - echo "Terraform apply completed successfully."

  #artifacts:
  #  reports:
  #    dotenv: priority.env

  only:
    - main
  needs:
    - job: plan_prod